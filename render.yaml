# Render blueprint: API + managed PostgreSQL.
#
# Usage: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.
#
# No manual schema edits are needed. `build:prod` generates the Prisma client
# from the committed prisma/postgres/schema.prisma (PostgreSQL) and
# `db:deploy` applies prisma/postgres/migrations. The SQLite schema used for
# local dev is untouched. See server/scripts/sync-postgres-schema.mjs.

databases:
  - name: crypto-advisor-db
    databaseName: crypto_advisor
    user: crypto_advisor
    plan: free

services:
  - type: web
    name: crypto-advisor-api
    runtime: node
    plan: free
    # Deploy from the REPO ROOT, not server/. This is an npm-workspaces monorepo:
    # package-lock.json only exists at the root, so installing from server/ would
    # resolve dependencies fresh on every deploy (unreproducible) and ignore the
    # root package.json entirely.
    rootDir: .
    #
    # `--include=dev` is REQUIRED, not optional. NODE_ENV=production (set below)
    # makes npm omit devDependencies by default, which would strip typescript and
    # @types/node and fail the build with:
    #   TS2688: Cannot find type definition file for 'node'
    # The runtime still gets NODE_ENV=production; only the build needs dev deps.
    buildCommand: npm ci --include=dev && npm run build:prod -w server && npm run db:deploy -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-advisor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set this to your deployed frontend origin (comma-separated for several).
      - key: CORS_ORIGIN
        sync: false
      # Optional integrations - the app degrades gracefully without them.
      - key: COINGECKO_API_KEY
        sync: false
      - key: CRYPTOPANIC_API_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: mistralai/mistral-7b-instruct:free
      - key: HUGGINGFACE_API_KEY
        sync: false
